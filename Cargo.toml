[workspace.package]
repository = "https://github.com/rust-vmm/rust-vmm"

[workspace]
members = [
  "acpi_tables",
  "vm-memory",
  "vmm-sys-util",
  "vm-virtio/virtio-bindings",
  "vm-virtio/virtio-blk",
  "vm-virtio/virtio-console",
  "vm-virtio/virtio-device",
  "vm-virtio/virtio-queue",
  "vm-virtio/virtio-queue-ser",
  "vm-virtio/virtio-vsock",
]
resolver = "2"

# When running benchmark it's convenient to run with lto=true and codegen-units=1.
# While these might increase the build time, it may also produce faster code. These
# options are typically used in release binaries as well.
[profile.bench]
lto = true
codegen-units = 1

[workspace.dependencies]
vm-memory = { version = "0.18.0", path = "vm-memory" }
vmm-sys-util = { version = "0.15.0", path = "vmm-sys-util" }