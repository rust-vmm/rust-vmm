[package]
name = "mshv-ioctls"
version = "0.7.1"
authors = ["Microsoft Authors"]
edition = "2021"
license = "Apache-2.0 OR BSD-3-Clause"
readme = "README.md"
keywords = ["mshv", "Microsoft", "Hypervisor", "MSHV"]
repository.workspace = true
description = "Safe wrappers over MSHV ioctl"

[dependencies]
libc = ">=0.2.39"
mshv-bindings = { version = "=0.7.1", path = "../mshv-bindings", features = [
  "fam-wrappers",
] }
thiserror = "2.0"
vmm-sys-util = { version = ">=0.12.1", path = "../../vmm-sys-util" }
