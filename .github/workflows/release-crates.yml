name: Publish rust-vmm crates to crates.io

on:
  push:
    tags:
      - 'acpi_tables-v*'
      - 'event-manager-v*'
      - 'linux-loader-v*'
      - 'seccompiler-v*'
      - 'vm-allocator-v*'
      - 'vm-memory-v*'
      - 'virtio-bindings-v*'
      - 'virtio-blk-v*'
      - 'virtio-console-v*'
      - 'virtio-device-v*'
      - 'virtio-queue-v*'
      - 'virtio-queue-ser-v*'
      - 'virtio-vsock-v*'
      - 'vmm-sys-util-v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Extract crate name
        id: crate
        run: |
          TAG="${GITHUB_REF_NAME}"
          CRATE="${TAG%-v*}"
          echo "name=$CRATE" >> "$GITHUB_OUTPUT"

      - name: Publish crate
        run: cargo publish --package "${{ steps.crate.outputs.name }}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
