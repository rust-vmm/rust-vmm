name: Publish crate to crates.io

on:
  push:
    tags:
      - '*-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC trusted publishing authentication
      contents: read   # Good security baseline practice
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Authenticate with crates.io
      uses: rust-lang/crates-io-auth-action@v1
      id: auth

    - name: Validate tag format
      id: validate
      shell: bash
      run: |
        TAG="$GITHUB_REF_NAME"
        # Enforce strict tag format: {crate-name}-v{version} (e.g. acpi_tables-v0.2.1)
        if [[ ! "$TAG" =~ ^[a-z][a-z0-9_-]+-v[0-9]+\.[0-9]+\.[0-9]+.* ]]; then
          echo "::error::Tag '$TAG' does not match expected format '{crate}-v{version}'."
          exit 1
        fi
        CRATE="${TAG%-v*}"
        VERSION="${TAG#$CRATE-v}"
        if ! grep -q "\"$CRATE\"" Cargo.toml; then
          echo "::error::Crate '$CRATE' is not a member of the workspace."
          exit 1
        fi
        echo "name=$CRATE" >> "$GITHUB_OUTPUT"
    - name: Publish ${{ steps.validate.outputs.name }}
      run: cargo publish --package ${{ steps.validate.outputs.name }}
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
