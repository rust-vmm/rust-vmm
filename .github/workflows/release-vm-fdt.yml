name: Publish vm-fdt to crates.io

on:
  push:
    tags: ['vm-fdt-v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@v4
    - uses: rust-lang/crates-io-auth-action@v1
      id: auth
    - run: cargo publish --package vm-fdt
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
